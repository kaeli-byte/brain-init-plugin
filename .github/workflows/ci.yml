name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_call:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: pip install pyyaml requests

      - name: Shell syntax check (bash -n)
        run: |
          find . -name '*.sh' -not -path './.git/*' -print0 | while IFS= read -r -d '' f; do
            echo "Checking $f"
            bash -n "$f"
          done

      - name: ShellCheck lint (advisory)
        run: |
          if ! command -v shellcheck &>/dev/null && command -v apt-get &>/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          fi
          if command -v shellcheck &>/dev/null; then
            find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 shellcheck --severity=warning || true
          else
            echo "shellcheck not available -- skipping"
          fi

      - name: Validate plugin.json
        run: python3 -c 'import json; json.load(open(".claude-plugin/plugin.json")); print("plugin.json OK")'

      - name: Validate marketplace.json
        run: python3 -c 'import json; json.load(open(".claude-plugin/marketplace.json")); print("marketplace.json OK")'

      - name: Validate hooks.json
        run: |
          python3 -c '
          import json
          h = json.load(open("skills/brain-init/assets/hooks.json"))
          n = len(h.get("hooks", []))
          print(f"hooks.json OK ({n} hooks)")
          '

      - name: Validate settings.json
        run: python3 -c 'import json; json.load(open("skills/brain-init/assets/settings.json")); print("settings.json OK")'

      - name: Validate all YAML schemas
        run: |
          python3 << 'PYEOF'
          import yaml, os, sys
          schema_dir = 'skills/brain-init/assets/schemas'
          total = 0
          failed = 0
          for f in sorted(os.listdir(schema_dir)):
              if f.endswith(('.yaml', '.yml')):
                  total += 1
                  path = os.path.join(schema_dir, f)
                  try:
                      with open(path) as fh:
                          yaml.safe_load(fh)
                      print(f'  OK  {f}')
                  except Exception as e:
                      print(f'  FAIL {f}: {e}')
                      failed += 1
          if failed:
              print(f'\n{failed}/{total} schema(s) failed YAML validation')
              sys.exit(1)
          print(f'{total} schemas: all valid')
          PYEOF

      - name: Check no hardcoded legacy paths in hooks.json
        run: |
          if grep -qF '~/deep-tech-wiki' skills/brain-init/assets/hooks.json; then
            echo "FAIL: hooks.json contains hardcoded ~/deep-tech-wiki"
            exit 1
          fi
          echo "OK: no hardcoded legacy paths"

      - name: Verify domain templates exist for all presets
        run: |
          PRESETS=(industrial-intelligence semiconductor biotech energy materials)
          FAILED=0
          for preset in "${PRESETS[@]}"; do
            for tmpl in "skills/brain-init/templates/claude-md/${preset}.md" \
                        "skills/brain-init/templates/purpose/${preset}.md"; do
              if [ ! -f "$tmpl" ]; then
                echo "MISSING: $tmpl"
                FAILED=$((FAILED + 1))
              fi
            done
          done
          if [ "$FAILED" -gt 0 ]; then
            echo "FAIL: $FAILED domain template(s) missing"
            exit 1
          fi
          echo "OK: all ${#PRESETS[@]} presets have CLAUDE.md + purpose.md templates"

      - name: Asset inventory (reporting only)
        run: |
          echo "=== Asset inventory ==="
          echo "YAML schemas:  $(find skills/brain-init/assets/schemas -name '*.yaml' | wc -l | tr -d ' ')"
          echo "Domain tmpl:   $(find skills/brain-init/templates -name '*.md' | wc -l | tr -d ' ')"
          echo "Agents:        $(find skills/brain-init/assets/agents -name '*.md' | wc -l | tr -d ' ')"
          echo "Config:        $(find skills/brain-init/assets/config -name '*.md' | wc -l | tr -d ' ')"
          echo "Bases:         $(find skills/brain-init/assets/bases -name '*.base' | wc -l | tr -d ' ')"
          echo "Obsidian:      $(find skills/brain-init/assets/obsidian -type f | wc -l | tr -d ' ')"
          echo "Skill bundles: $(find skills/brain-init/bundles -name 'SKILL.md' | wc -l | tr -d ' ')"
          echo "Shell scripts: $(find . -name '*.sh' -not -path './.git/*' | wc -l | tr -d ' ')"

  bundle-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: pip install pyyaml

      - name: Python syntax check (all .py files)
        run: |
          FAILED=0
          while IFS= read -r -d '' f; do
            echo "Checking $f"
            python3 -m py_compile "$f" || FAILED=$((FAILED + 1))
          done < <(find . -name '*.py' -not -path './.git/*' -print0)
          if [ "$FAILED" -gt 0 ]; then
            echo "FAIL: $FAILED Python file(s) have syntax errors"
            exit 1
          fi
          echo "OK: all Python files pass syntax check"

      - name: Runtime unit and fixture tests
        run: |
          PYTHONPATH=skills/brain-init/runtime \
          python3 -m unittest discover -s skills/brain-init/runtime/tests -v

      - name: Validate SKILL.md frontmatter (all bundles)
        run: |
          python3 << 'PYEOF'
          import yaml, os, sys
          failed = 0
          for root, dirs, files in os.walk('.'):
              if '.git' in root:
                  continue
              for f in files:
                  if f != 'SKILL.md':
                      continue
                  path = os.path.join(root, f)
                  content = open(path).read()
                  if not content.startswith('---'):
                      print(f'  FAIL {path}: no YAML frontmatter (missing --- delimiters)')
                      failed += 1
                      continue
                  parts = content.split('---', 2)
                  if len(parts) < 3:
                      print(f'  FAIL {path}: unclosed frontmatter')
                      failed += 1
                      continue
                  try:
                      fm = yaml.safe_load(parts[1])
                      if not isinstance(fm, dict):
                          print(f'  FAIL {path}: frontmatter is not a mapping')
                          failed += 1
                      else:
                          name = fm.get('name', 'UNNAMED')
                          print(f'  OK  {path} ({name})')
                  except Exception as e:
                      print(f'  FAIL {path}: {e}')
                      failed += 1
          if failed:
              print(f'\n{failed} SKILL.md file(s) have invalid frontmatter')
              sys.exit(1)
          print('All SKILL.md files: valid frontmatter')
          PYEOF

  version-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install pyyaml

      - name: Check version bumps
        run: python3 .github/scripts/check-versions.py

  smoke-test:
    runs-on: ubuntu-latest
    needs: [validate, bundle-check, version-gate]
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: pip install pyyaml requests

      - name: Smoke test -- full scaffold (semiconductor) + validate
        run: |
          TMP="$(mktemp -d)"
          export CLAUDE_PLUGIN_ROOT="$PWD"

          echo "=== Full scaffold (semiconductor) ==="
          bash skills/brain-init/scripts/brain-init.sh \
            "$TMP/test-full" \
            --domain semiconductor \
            --no-git --no-qmd --no-obsidian --no-supporting-skills
          echo ""

          [ -f "$TMP/test-full/.brain/runtime/brain_runtime/cli.py" ] || { echo "FAIL: brain runtime missing"; exit 1; }
          [ -d "$TMP/test-full/.brain/runs" ] || { echo "FAIL: .brain/runs missing"; exit 1; }
          [ -d "$TMP/test-full/.brain/evals" ] || { echo "FAIL: .brain/evals missing"; exit 1; }
          grep -q '^/.brain/runs/' "$TMP/test-full/.gitignore" || { echo "FAIL: runtime runs are not gitignored"; exit 1; }
          PYTHONPATH="$TMP/test-full/.brain/runtime" python3 -c 'import brain_runtime; print(brain_runtime.__version__)'

          echo "=== Reconcile-aware vault contract ==="
          [ -d "$TMP/test-full/wiki/reconciliations" ] || { echo "FAIL: wiki/reconciliations missing"; exit 1; }
          [ -f "$TMP/test-full/templates/schemas/reconciliation.yaml" ] || { echo "FAIL: reconciliation schema missing"; exit 1; }
          [ -f "$TMP/test-full/.claude/skills/second-brain-reconcile/references/automatic-handoff.md" ] || { echo "FAIL: reconcile reference missing"; exit 1; }
          grep -q '^## Reconciliations (0)' "$TMP/test-full/wiki/index.md" || { echo "FAIL: index Reconciliations section missing"; exit 1; }

          echo "=== Validate the scaffold ==="
          set +e
          VALIDATE_OUTPUT="$(
            bash skills/brain-init/scripts/validate-vault.sh "$TMP/test-full" 2>&1
          )"
          VALIDATE_STATUS=$?
          set -e
          printf '%s\n' "$VALIDATE_OUTPUT"
          [ "$VALIDATE_STATUS" -eq 0 ] || { echo "FAIL: fresh scaffold validation failed"; exit 1; }
          UNEXPECTED_WARNINGS="$(
            printf '%s\n' "$VALIDATE_OUTPUT" |
              grep '\[WARN\]' |
              grep -Ev 'types\.json not found|Index freshness:|qmd(:| symlink| .+not initialized)|pdftotext:|agent_gw:|KIMI_API_KEY:|KIMI_BASE_URL:|KIMI connectivity:|MINERU_TOKEN:|Git: not initialized' ||
              true
          )"
          [ -z "$UNEXPECTED_WARNINGS" ] || {
            printf '%s\n' "$UNEXPECTED_WARNINGS"
            echo "FAIL: fresh scaffold emitted an unclassified validator warning"
            exit 1
          }

          echo "=== Validate legacy vault without runtime ==="
          LEGACY_RUNTIME_VAULT="$TMP/test-legacy-runtime"
          cp -R "$TMP/test-full" "$LEGACY_RUNTIME_VAULT"
          rm -rf "$LEGACY_RUNTIME_VAULT/.brain"
          set +e
          LEGACY_VALIDATE_OUTPUT="$(
            bash skills/brain-init/scripts/validate-vault.sh \
              "$LEGACY_RUNTIME_VAULT" 2>&1
          )"
          LEGACY_VALIDATE_STATUS=$?
          set -e
          [ "$LEGACY_VALIDATE_STATUS" -eq 0 ] || {
            printf '%s\n' "$LEGACY_VALIDATE_OUTPUT"
            echo "FAIL: legacy missing-runtime vault must remain valid"
            exit 1
          }
          RUNTIME_WARNINGS="$(
            printf '%s\n' "$LEGACY_VALIDATE_OUTPUT" |
              awk '
                /── Brain Runtime ──/ { in_runtime=1; next }
                /── qmd Health ──/ { in_runtime=0 }
                in_runtime && /\[WARN\]/ {
                  sub(/^[[:space:]]+/, "")
                  print
                }
              '
          )"
          EXPECTED_RUNTIME_WARNINGS="$(printf '%s\n' \
            '[WARN] .brain/runs/ — MISSING' \
            '[WARN] .brain/evals/ — MISSING' \
            '[WARN] brain runtime code — MISSING' \
            '[WARN] brain runtime import failed — capture will run without shadow instrumentation')"
          [ "$RUNTIME_WARNINGS" = "$EXPECTED_RUNTIME_WARNINGS" ] || {
            printf 'Expected runtime warnings:\n%s\nActual runtime warnings:\n%s\n' \
              "$EXPECTED_RUNTIME_WARNINGS" "$RUNTIME_WARNINGS"
            exit 1
          }
          echo "OK: legacy missing runtime remains warning-only"
          echo ""

          echo "=== Verify CLAUDE.md was domain-adapted ==="
          if grep -qi 'semiconductor\|chip\|fab' "$TMP/test-full/CLAUDE.md"; then
            echo "OK: CLAUDE.md contains semiconductor domain keywords"
          else
            echo "FAIL: CLAUDE.md not domain-adapted"
            exit 1
          fi
          rm -rf "$TMP"

      - name: Smoke test -- shadow rejection preserves artifacts
        run: |
          TMP="$(mktemp -d)"
          export CLAUDE_PLUGIN_ROOT="$PWD"
          VAULT="$TMP/shadow-reject"

          bash skills/brain-init/scripts/brain-init.sh \
            "$VAULT" \
            --domain industrial-intelligence \
            --no-git --no-qmd --no-obsidian --no-supporting-skills

          mkdir -p "$VAULT/raw/annual-reports"
          printf 'fixture\n' > "$VAULT/raw/annual-reports/acme-2025.pdf"
          cat > "$VAULT/wiki/claims/invalid-claim.md" <<'EOF'
          ---
          id: claim-invalid
          type: claim
          status: supported
          ---

          # Invalid claim
          EOF
          printf '["wiki/claims/invalid-claim.md"]\n' > "$TMP/declared-paths.json"

          RUN_ID="$(
            PYTHONPATH="$VAULT/.brain/runtime" \
            python3 -m brain_runtime.cli start \
              --vault "$VAULT" \
              --operation capture \
              --mode shadow \
              --profile annual-report-v1 \
              --input raw/annual-reports/acme-2025.pdf
          )"
          PYTHONPATH="$VAULT/.brain/runtime" \
          python3 -m brain_runtime.cli declare \
            --vault "$VAULT" \
            --run-id "$RUN_ID" \
            --paths-file "$TMP/declared-paths.json"

          set +e
          VERIFY_OUTPUT="$(
            PYTHONPATH="$VAULT/.brain/runtime" \
            python3 -m brain_runtime.cli verify \
              --vault "$VAULT" \
              --run-id "$RUN_ID" 2>&1
          )"
          VERIFY_STATUS=$?
          set -e

          [ "$VERIFY_STATUS" -eq 0 ] || { echo "$VERIFY_OUTPUT"; echo "FAIL: shadow verify blocked capture"; exit 1; }
          grep -q 'Runtime shadow: REJECT' <<<"$VERIFY_OUTPUT" || { echo "$VERIFY_OUTPUT"; echo "FAIL: expected shadow rejection"; exit 1; }
          [ -f "$VAULT/wiki/claims/invalid-claim.md" ] || { echo "FAIL: shadow rejection removed canonical artifact"; exit 1; }
          python3 - "$VAULT/.brain/runs/$RUN_ID/verification.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              report = json.load(handle)
          if report.get("accepted") is not False:
              raise SystemExit("FAIL: verification report did not record accepted=false")
          PY

          echo "OK: shadow rejection preserved the invalid canonical artifact"
          rm -rf "$TMP"

      - name: Smoke test -- all 5 domain presets
        run: |
          TMP="$(mktemp -d)"
          export CLAUDE_PLUGIN_ROOT="$PWD"
          PRESETS=(industrial-intelligence semiconductor biotech energy materials)
          FAILED=0

          for preset in "${PRESETS[@]}"; do
            echo "=== Scaffold: $preset ==="
            bash skills/brain-init/scripts/brain-init.sh \
              "$TMP/test-$preset" \
              --domain "$preset" \
              --no-git --no-qmd --no-obsidian --no-supporting-skills \
              2>&1 | tail -2
            [ -f "$TMP/test-$preset/CLAUDE.md" ] || { echo "  FAIL: CLAUDE.md missing"; FAILED=$((FAILED + 1)); continue; }
            echo "  OK"
          done

          if [ "$FAILED" -gt 0 ]; then
            echo "FAIL: $FAILED domain preset(s) failed to scaffold"
            exit 1
          fi
          echo "OK: all 5 presets scaffolded successfully"
          rm -rf "$TMP"

      - name: Smoke test -- --domain-custom + --name
        run: |
          TMP="$(mktemp -d)"
          export CLAUDE_PLUGIN_ROOT="$PWD"

          bash skills/brain-init/scripts/brain-init.sh \
            "$TMP/test-custom" \
            --domain-custom "Renewable energy supply chains" \
            --name "My Brain" \
            --no-git --no-qmd --no-obsidian --no-supporting-skills
          echo ""

          [ -f "$TMP/test-custom/CLAUDE.md" ] || { echo "FAIL: CLAUDE.md missing"; exit 1; }
          [ -f "$TMP/test-custom/config/purpose.md" ] || { echo "FAIL: purpose.md missing"; exit 1; }

          # CLAUDE.md should mention the custom domain description (template has {{DOMAIN}} substitution)
          if grep -qi 'renewable' "$TMP/test-custom/CLAUDE.md"; then
            echo "OK: custom domain propagated to CLAUDE.md"
          else
            echo "WARN: custom domain text not found in CLAUDE.md (template may lack domain keywords)"
          fi

          echo "OK: --domain-custom + --name scaffolded successfully"
          rm -rf "$TMP"

      - name: Smoke test -- bare scaffold
        run: |
          TMP="$(mktemp -d)"
          export CLAUDE_PLUGIN_ROOT="$PWD"

          bash skills/brain-init/scripts/brain-init.sh \
            "$TMP/test-bare" \
            --bare --no-git

          [ -d "$TMP/test-bare/wiki/claims" ] || { echo "FAIL: wiki/claims missing"; exit 1; }
          [ -f "$TMP/test-bare/.gitignore" ] || { echo "FAIL: .gitignore missing"; exit 1; }
          [ ! -f "$TMP/test-bare/CLAUDE.md" ] || { echo "FAIL: bare mode should not create CLAUDE.md"; exit 1; }
          [ ! -d "$TMP/test-bare/.brain/runtime" ] || { echo "FAIL: bare mode installed runtime"; exit 1; }

          echo "OK: bare scaffold verified (no harness files)"
          rm -rf "$TMP"

      - name: Smoke test -- --force into non-empty dir
        run: |
          TMP="$(mktemp -d)"
          export CLAUDE_PLUGIN_ROOT="$PWD"

          mkdir -p "$TMP/test-force/existing-file"
          echo "hello" > "$TMP/test-force/existing-file.txt"

          bash skills/brain-init/scripts/brain-init.sh \
            "$TMP/test-force" \
            --domain materials --force \
            --no-git --no-qmd --no-obsidian --no-supporting-skills

          [ -f "$TMP/test-force/existing-file.txt" ] || { echo "FAIL: existing file was deleted"; exit 1; }
          [ -f "$TMP/test-force/CLAUDE.md" ] || { echo "FAIL: CLAUDE.md missing (--force should merge)"; exit 1; }

          echo "OK: --force merged into non-empty directory"
          rm -rf "$TMP"

      - name: Smoke test -- upgrade harness
        run: |
          TMP="$(mktemp -d)"
          export CLAUDE_PLUGIN_ROOT="$PWD"
          VAULT="$TMP/test-vault"

          mkdir -p \
            "$VAULT/wiki" \
            "$VAULT/raw" \
            "$VAULT/.claude/hooks" \
            "$VAULT/.claude/agents" \
            "$VAULT/.claude/skills" \
            "$VAULT/.brain/runtime/brain_runtime" \
            "$VAULT/templates/schemas" \
            "$VAULT/Templates/Bases" \
            "$VAULT/config"
          printf '%s\n' '# Legacy log' > "$VAULT/wiki/log.md"
          printf '%s\n' 'preserve wiki' > "$VAULT/wiki/user-page.md"
          printf '%s\n' 'preserve raw' > "$VAULT/raw/user-source.txt"
          printf '%s\n' 'stale runtime' \
            > "$VAULT/.brain/runtime/brain_runtime/stale-runtime.txt"
          printf '%s\n' '# custom gitignore entry' '*.private' > "$VAULT/.gitignore"
          printf '%s\n' '# custom claudeignore entry' 'private-notes/' \
            > "$VAULT/.claudeignore"

          bash skills/brain-init/scripts/brain-init.sh --upgrade-harness "$VAULT"

          [ -d "$VAULT/.brain/runs" ] || { echo "FAIL: upgrade did not migrate .brain/runs"; exit 1; }
          [ -d "$VAULT/.brain/evals" ] || { echo "FAIL: upgrade did not migrate .brain/evals"; exit 1; }
          [ -f "$VAULT/.brain/runtime/brain_runtime/cli.py" ] || { echo "FAIL: current runtime missing"; exit 1; }
          [ ! -e "$VAULT/.brain/runtime/brain_runtime/stale-runtime.txt" ] || { echo "FAIL: stale runtime survived replacement"; exit 1; }
          if find "$VAULT/.brain/runtime/brain_runtime" -type l -print -quit | grep -q .; then
            echo "FAIL: installed runtime contains a symlink"
            exit 1
          fi
          grep -qxF '/.brain/runs/' "$VAULT/.gitignore" || { echo "FAIL: run history gitignore rule missing"; exit 1; }
          grep -qxF '.brain/runs/' "$VAULT/.claudeignore" || { echo "FAIL: run history claudeignore rule missing"; exit 1; }
          grep -qxF '*.private' "$VAULT/.gitignore" || { echo "FAIL: custom gitignore content changed"; exit 1; }
          grep -qxF 'private-notes/' "$VAULT/.claudeignore" || { echo "FAIL: custom claudeignore content changed"; exit 1; }
          [ -f "$VAULT/wiki/user-page.md" ] || { echo "FAIL: wiki content was not preserved"; exit 1; }
          [ -f "$VAULT/raw/user-source.txt" ] || { echo "FAIL: raw content was not preserved"; exit 1; }

          # Legacy vault has no reconcile-aware contract; upgrade must add it.
          # Reconcile is now part of the standard scaffold — strip it to
          # simulate a vault created before the reconcile feature shipped.
          rm -rf \
            "$VAULT/wiki/reconciliations" \
            "$VAULT/templates/schemas/reconciliation.yaml" \
            "$VAULT/.claude/skills/second-brain-reconcile"
          [ ! -d "$VAULT/wiki/reconciliations" ] && : || { echo "FAIL: failed to strip wiki/reconciliations"; exit 1; }
          [ ! -e "$VAULT/templates/schemas/reconciliation.yaml" ] || { echo "FAIL: failed to strip reconciliation schema"; exit 1; }
          [ ! -e "$VAULT/.claude/skills/second-brain-reconcile/references/automatic-handoff.md" ] || { echo "FAIL: failed to strip reconcile reference"; exit 1; }
          SENTINEL_BEFORE="$(shasum -a 256 "$VAULT/wiki/user-page.md" | cut -d' ' -f1)"
          bash skills/brain-init/scripts/brain-init.sh --upgrade-harness "$VAULT"
          [ -d "$VAULT/wiki/reconciliations" ] || { echo "FAIL: upgrade did not add wiki/reconciliations"; exit 1; }
          [ -f "$VAULT/templates/schemas/reconciliation.yaml" ] || { echo "FAIL: upgrade did not add reconciliation schema"; exit 1; }
          [ -f "$VAULT/.claude/skills/second-brain-reconcile/references/automatic-handoff.md" ] || { echo "FAIL: upgrade did not install reconcile references"; exit 1; }
          [ "$(shasum -a 256 "$VAULT/wiki/user-page.md" | cut -d' ' -f1)" = "$SENTINEL_BEFORE" ] || { echo "FAIL: sentinel wiki page changed"; exit 1; }

          mkdir -p "$VAULT/.brain/runs/preserve-me"
          printf '%s\n' keep > "$VAULT/.brain/runs/preserve-me/marker.txt"
          printf '%s\n' labels > "$VAULT/.brain/evals/human-labels.jsonl"
          printf '%s\n' 'stale again' \
            > "$VAULT/.brain/runtime/brain_runtime/stale-runtime.txt"

          bash skills/brain-init/scripts/brain-init.sh --upgrade-harness "$VAULT"

          [ -f "$VAULT/.brain/runs/preserve-me/marker.txt" ] || { echo "FAIL: upgrade deleted run history"; exit 1; }
          [ -f "$VAULT/.brain/evals/human-labels.jsonl" ] || { echo "FAIL: upgrade deleted eval labels"; exit 1; }
          [ "$(shasum -a 256 "$VAULT/.brain/runs/preserve-me/marker.txt" | cut -d' ' -f1)" = "f660a7996deacfbc7560e4240054a8ad82eb02fe25a95064257e07084bcacb85" ] || { echo "FAIL: run history bytes changed"; exit 1; }
          [ ! -e "$VAULT/.brain/runtime/brain_runtime/stale-runtime.txt" ] || { echo "FAIL: repeat upgrade did not replace stale runtime"; exit 1; }
          [ "$(grep -cFx '/.brain/runs/' "$VAULT/.gitignore")" -eq 1 ] || { echo "FAIL: gitignore migration is not idempotent"; exit 1; }
          [ "$(grep -cFx '.brain/runs/' "$VAULT/.claudeignore")" -eq 1 ] || { echo "FAIL: claudeignore migration is not idempotent"; exit 1; }
          PYTHONPATH="$VAULT/.brain/runtime" python3 -c 'import brain_runtime'
          echo "OK: legacy upgrade replaced runtime, migrated ownership, and preserved state"

          rm -rf "$TMP"

      - name: Smoke test -- upgrade runtime ownership symlink is refused
        run: |
          TMP="$(mktemp -d)"
          export CLAUDE_PLUGIN_ROOT="$PWD"

          make_upgrade_vault() {
            local vault="$1"
            mkdir -p \
              "$vault/wiki" \
              "$vault/.claude/hooks" \
              "$vault/.claude/agents" \
              "$vault/.claude/skills" \
              "$vault/templates/schemas" \
              "$vault/Templates/Bases" \
              "$vault/config" \
              "$vault/.brain"
            printf '%s\n' '# Legacy log' > "$vault/wiki/log.md"
          }

          UPGRADE_VAULT="$TMP/upgrade-vault"
          UPGRADE_EXTERNAL="$TMP/upgrade-external-runtime"
          make_upgrade_vault "$UPGRADE_VAULT"
          mkdir -p "$UPGRADE_EXTERNAL/brain_runtime"
          printf '%s\n' 'do not delete' \
            > "$UPGRADE_EXTERNAL/brain_runtime/external-sentinel.txt"
          ln -s "$UPGRADE_EXTERNAL" "$UPGRADE_VAULT/.brain/runtime"

          set +e
          UPGRADE_OUTPUT="$(
            bash skills/brain-init/scripts/brain-init.sh \
              --upgrade-harness "$UPGRADE_VAULT" 2>&1
          )"
          UPGRADE_STATUS=$?
          set -e
          [ "$UPGRADE_STATUS" -ne 0 ] || { echo "FAIL: upgrade accepted symlinked runtime ownership"; exit 1; }
          grep -qi 'symlinked runtime ownership' <<<"$UPGRADE_OUTPUT" || { printf '%s\n' "$UPGRADE_OUTPUT"; exit 1; }
          [ -f "$UPGRADE_EXTERNAL/brain_runtime/external-sentinel.txt" ] || { echo "FAIL: upgrade changed external sentinel"; exit 1; }
          [ -L "$UPGRADE_VAULT/.brain/runtime" ] || { echo "FAIL: upgrade replaced ownership symlink"; exit 1; }

          echo "OK: upgrade refuses symlinked runtime ownership"
          rm -rf "$TMP"

      - name: Smoke test -- force install runtime ownership symlink is refused
        run: |
          TMP="$(mktemp -d)"
          export CLAUDE_PLUGIN_ROOT="$PWD"
          FORCE_VAULT="$TMP/force-vault"
          FORCE_EXTERNAL="$TMP/force-external-runtime"
          mkdir -p "$FORCE_VAULT/wiki" "$FORCE_VAULT/.brain"
          printf '%s\n' '# Existing vault' > "$FORCE_VAULT/wiki/log.md"
          mkdir -p "$FORCE_EXTERNAL/brain_runtime"
          printf '%s\n' 'do not delete' \
            > "$FORCE_EXTERNAL/brain_runtime/external-sentinel.txt"
          ln -s "$FORCE_EXTERNAL" "$FORCE_VAULT/.brain/runtime"

          set +e
          FORCE_OUTPUT="$(
            bash skills/brain-init/scripts/brain-init.sh \
              "$FORCE_VAULT" \
              --force --domain industrial-intelligence \
              --no-git --no-qmd --no-obsidian --no-supporting-skills 2>&1
          )"
          FORCE_STATUS=$?
          set -e
          [ "$FORCE_STATUS" -ne 0 ] || { echo "FAIL: force install accepted symlinked runtime ownership"; exit 1; }
          grep -qi 'symlinked runtime ownership' <<<"$FORCE_OUTPUT" || { printf '%s\n' "$FORCE_OUTPUT"; exit 1; }
          [ -f "$FORCE_EXTERNAL/brain_runtime/external-sentinel.txt" ] || { echo "FAIL: force install changed external sentinel"; exit 1; }
          [ -L "$FORCE_VAULT/.brain/runtime" ] || { echo "FAIL: force install replaced ownership symlink"; exit 1; }

          echo "OK: force install refuses symlinked runtime ownership"
          rm -rf "$TMP"

      - name: Smoke test -- symlinked runtime source is refused
        run: |
          TMP="$(mktemp -d)"
          export CLAUDE_PLUGIN_ROOT="$PWD"
          VAULT="$TMP/vault"
          TEMPLATE="$TMP/template"
          EXTERNAL_SOURCE="$TMP/external-source"

          mkdir -p \
            "$VAULT/wiki" \
            "$VAULT/.claude/hooks" \
            "$VAULT/.claude/agents" \
            "$VAULT/.claude/skills" \
            "$VAULT/templates/schemas" \
            "$VAULT/Templates/Bases" \
            "$VAULT/config" \
            "$VAULT/.brain/runtime/brain_runtime" \
            "$TEMPLATE/.brain/runtime" \
            "$EXTERNAL_SOURCE"
          printf '%s\n' '# Legacy log' > "$VAULT/wiki/log.md"
          printf '%s\n' 'old runtime' \
            > "$VAULT/.brain/runtime/brain_runtime/old-runtime.txt"
          cp -R skills/brain-init/runtime/brain_runtime \
            "$EXTERNAL_SOURCE/brain_runtime"
          ln -s "$EXTERNAL_SOURCE/brain_runtime" \
            "$TEMPLATE/.brain/runtime/brain_runtime"

          set +e
          SOURCE_OUTPUT="$(
            bash skills/brain-init/scripts/brain-init.sh \
              --upgrade-harness "$VAULT" \
              --template-path "$TEMPLATE" 2>&1
          )"
          SOURCE_STATUS=$?
          set -e

          [ "$SOURCE_STATUS" -ne 0 ] || { echo "FAIL: upgrade accepted symlinked runtime source"; exit 1; }
          grep -qi 'symlinked runtime source' <<<"$SOURCE_OUTPUT" || { printf '%s\n' "$SOURCE_OUTPUT"; exit 1; }
          [ -f "$VAULT/.brain/runtime/brain_runtime/old-runtime.txt" ] || { echo "FAIL: rejected source replaced prior runtime"; exit 1; }
          [ ! -L "$VAULT/.brain/runtime/brain_runtime" ] || { echo "FAIL: source symlink was installed"; exit 1; }

          echo "OK: symlinked runtime source is refused"
          rm -rf "$TMP"

      - name: Smoke test -- active runtime replacement lock is refused
        run: |
          TMP="$(mktemp -d)"
          export CLAUDE_PLUGIN_ROOT="$PWD"
          VAULT="$TMP/vault"

          mkdir -p \
            "$VAULT/wiki" \
            "$VAULT/.claude/hooks" \
            "$VAULT/.claude/agents" \
            "$VAULT/.claude/skills" \
            "$VAULT/templates/schemas" \
            "$VAULT/Templates/Bases" \
            "$VAULT/config" \
            "$VAULT/.brain/runtime/brain_runtime" \
            "$VAULT/.brain/runtime/.brain-runtime-install.lock"
          printf '%s\n' '# Legacy log' > "$VAULT/wiki/log.md"
          printf '%s\n' 'old runtime' \
            > "$VAULT/.brain/runtime/brain_runtime/old-runtime.txt"

          set +e
          LOCK_OUTPUT="$(
            bash skills/brain-init/scripts/brain-init.sh \
              --upgrade-harness "$VAULT" 2>&1
          )"
          LOCK_STATUS=$?
          set -e

          [ "$LOCK_STATUS" -ne 0 ] || { echo "FAIL: upgrade ignored active replacement lock"; exit 1; }
          grep -qi 'runtime replacement is already in progress' <<<"$LOCK_OUTPUT" || { printf '%s\n' "$LOCK_OUTPUT"; exit 1; }
          grep -qi 'remove it only after confirming no installer is active' <<<"$LOCK_OUTPUT" || { printf '%s\n' "$LOCK_OUTPUT"; exit 1; }
          [ -f "$VAULT/.brain/runtime/brain_runtime/old-runtime.txt" ] || { echo "FAIL: locked upgrade replaced prior runtime"; exit 1; }

          echo "OK: active runtime replacement lock is refused"
          rm -rf "$TMP"

      - name: Smoke test -- failed runtime rollback preserves backup
        run: |
          TMP="$(mktemp -d)"
          export CLAUDE_PLUGIN_ROOT="$PWD"
          VAULT="$TMP/vault"

          mkdir -p \
            "$VAULT/wiki" \
            "$VAULT/.claude/hooks" \
            "$VAULT/.claude/agents" \
            "$VAULT/.claude/skills" \
            "$VAULT/templates/schemas" \
            "$VAULT/Templates/Bases" \
            "$VAULT/config" \
            "$VAULT/.brain/runtime/brain_runtime" \
            "$TMP/bin"
          printf '%s\n' '# Legacy log' > "$VAULT/wiki/log.md"
          printf '%s\n' 'old runtime' \
            > "$VAULT/.brain/runtime/brain_runtime/old-runtime.txt"

          REAL_MV="$(command -v mv)"
          printf '%s\n' \
            '#!/usr/bin/env bash' \
            'set -euo pipefail' \
            'runtime_move=0' \
            'for argument in "$@"; do' \
            '  case "$argument" in *".brain/runtime"*) runtime_move=1 ;; esac' \
            'done' \
            'if [ "$runtime_move" -eq 0 ]; then exec "$BRAIN_INIT_TEST_REAL_MV" "$@"; fi' \
            'count=0' \
            'if [ -f "$BRAIN_INIT_TEST_MV_COUNT" ]; then IFS= read -r count < "$BRAIN_INIT_TEST_MV_COUNT"; fi' \
            'count=$((count + 1))' \
            'printf "%s\n" "$count" > "$BRAIN_INIT_TEST_MV_COUNT"' \
            'if [ "$count" -eq "${BRAIN_INIT_TEST_APPEAR_ON_CALL:-0}" ]; then' \
            '  mkdir -p "$BRAIN_INIT_TEST_APPEARING_TARGET"' \
            '  printf "%s\n" "# foreign runtime" > "$BRAIN_INIT_TEST_APPEARING_TARGET/__init__.py"' \
            'fi' \
            'case " $BRAIN_INIT_TEST_FAIL_MV_CALLS " in *" $count "*) exit 73 ;; esac' \
            'exec "$BRAIN_INIT_TEST_REAL_MV" "$@"' \
            > "$TMP/bin/mv"
          chmod +x "$TMP/bin/mv"

          set +e
          ROLLBACK_OUTPUT="$(
            PATH="$TMP/bin:$PATH" \
            BRAIN_INIT_TEST_REAL_MV="$REAL_MV" \
            BRAIN_INIT_TEST_MV_COUNT="$TMP/mv-count" \
            BRAIN_INIT_TEST_FAIL_MV_CALLS="2 3" \
            bash skills/brain-init/scripts/brain-init.sh \
              --upgrade-harness "$VAULT" 2>&1
          )"
          ROLLBACK_STATUS=$?
          set -e

          [ "$ROLLBACK_STATUS" -ne 0 ] || { echo "FAIL: injected runtime replacement failure was ignored"; exit 1; }
          grep -qi 'previous runtime preserved at' <<<"$ROLLBACK_OUTPUT" || { printf '%s\n' "$ROLLBACK_OUTPUT"; exit 1; }
          find "$VAULT/.brain/runtime" -name old-runtime.txt -type f -print -quit |
            grep -q . || { echo "FAIL: failed rollback deleted previous runtime backup"; exit 1; }
          [ ! -d "$VAULT/.brain/runtime/.brain-runtime-install.lock" ] || { echo "FAIL: failed replacement left active lock"; exit 1; }

          APPEAR_FAIL_VAULT="$TMP/appear-fail-vault"
          mkdir -p \
            "$APPEAR_FAIL_VAULT/wiki" \
            "$APPEAR_FAIL_VAULT/.claude/hooks" \
            "$APPEAR_FAIL_VAULT/.claude/agents" \
            "$APPEAR_FAIL_VAULT/.claude/skills" \
            "$APPEAR_FAIL_VAULT/templates/schemas" \
            "$APPEAR_FAIL_VAULT/Templates/Bases" \
            "$APPEAR_FAIL_VAULT/config" \
            "$APPEAR_FAIL_VAULT/.brain/runtime/brain_runtime"
          printf '%s\n' '# Legacy log' > "$APPEAR_FAIL_VAULT/wiki/log.md"
          printf '%s\n' 'old runtime' \
            > "$APPEAR_FAIL_VAULT/.brain/runtime/brain_runtime/old-runtime.txt"

          set +e
          APPEAR_FAIL_OUTPUT="$(
            PATH="$TMP/bin:$PATH" \
            BRAIN_INIT_TEST_REAL_MV="$REAL_MV" \
            BRAIN_INIT_TEST_MV_COUNT="$TMP/appear-fail-mv-count" \
            BRAIN_INIT_TEST_FAIL_MV_CALLS="2" \
            BRAIN_INIT_TEST_APPEAR_ON_CALL="2" \
            BRAIN_INIT_TEST_APPEARING_TARGET="$APPEAR_FAIL_VAULT/.brain/runtime/brain_runtime" \
            bash skills/brain-init/scripts/brain-init.sh \
              --upgrade-harness "$APPEAR_FAIL_VAULT" 2>&1
          )"
          APPEAR_FAIL_STATUS=$?
          set -e

          [ "$APPEAR_FAIL_STATUS" -ne 0 ] || { echo "FAIL: target-appearance install failure was ignored"; exit 1; }
          grep -qi 'previous runtime preserved at' <<<"$APPEAR_FAIL_OUTPUT" || { printf '%s\n' "$APPEAR_FAIL_OUTPUT"; exit 1; }
          find "$APPEAR_FAIL_VAULT/.brain/runtime" -name old-runtime.txt -type f -print -quit |
            grep -q . || { echo "FAIL: target-appearance failure deleted previous runtime backup"; exit 1; }
          [ ! -d "$APPEAR_FAIL_VAULT/.brain/runtime/.brain-runtime-install.lock" ] || { echo "FAIL: target-appearance failure left active lock"; exit 1; }

          NEST_VAULT="$TMP/nest-vault"
          mkdir -p \
            "$NEST_VAULT/wiki" \
            "$NEST_VAULT/.claude/hooks" \
            "$NEST_VAULT/.claude/agents" \
            "$NEST_VAULT/.claude/skills" \
            "$NEST_VAULT/templates/schemas" \
            "$NEST_VAULT/Templates/Bases" \
            "$NEST_VAULT/config" \
            "$NEST_VAULT/.brain/runtime/brain_runtime"
          printf '%s\n' '# Legacy log' > "$NEST_VAULT/wiki/log.md"
          printf '%s\n' 'old runtime' \
            > "$NEST_VAULT/.brain/runtime/brain_runtime/old-runtime.txt"

          set +e
          NEST_OUTPUT="$(
            PATH="$TMP/bin:$PATH" \
            BRAIN_INIT_TEST_REAL_MV="$REAL_MV" \
            BRAIN_INIT_TEST_MV_COUNT="$TMP/nest-mv-count" \
            BRAIN_INIT_TEST_FAIL_MV_CALLS="" \
            BRAIN_INIT_TEST_APPEAR_ON_CALL="2" \
            BRAIN_INIT_TEST_APPEARING_TARGET="$NEST_VAULT/.brain/runtime/brain_runtime" \
            bash skills/brain-init/scripts/brain-init.sh \
              --upgrade-harness "$NEST_VAULT" 2>&1
          )"
          NEST_STATUS=$?
          set -e

          [ "$NEST_STATUS" -ne 0 ] || { echo "FAIL: nested runtime replacement was accepted"; exit 1; }
          grep -qi 'previous runtime preserved at' <<<"$NEST_OUTPUT" || { printf '%s\n' "$NEST_OUTPUT"; exit 1; }
          find "$NEST_VAULT/.brain/runtime" -name old-runtime.txt -type f -print -quit |
            grep -q . || { echo "FAIL: nested replacement deleted previous runtime backup"; exit 1; }
          [ ! -d "$NEST_VAULT/.brain/runtime/.brain-runtime-install.lock" ] || { echo "FAIL: nested replacement left active lock"; exit 1; }

          echo "OK: failed rollback preserves the previous runtime backup"
          rm -rf "$TMP"
