name: Publish

on:
  push:
    tags: ['v*']

jobs:
  ci-pass:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci-pass
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: pip install pyyaml

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # Detect pre-release: tags like v1.0.0-rc1, v1.0.0-beta, v1.0.0-alpha*
          if echo "$VERSION" | grep -qE '-(alpha|beta|rc|pre)'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "Pre-release tag detected"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Tag: $TAG  Version: $VERSION"

      - name: Verify plugin.json version matches tag
        run: |
          JSON_VER=$(python3 -c "import json; print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          TAG_VER="${{ steps.version.outputs.version }}"
          if [ "$JSON_VER" != "$TAG_VER" ]; then
            echo "FAIL: plugin.json version ($JSON_VER) != tag version ($TAG_VER)"
            echo "Update .claude-plugin/plugin.json before tagging."
            exit 1
          fi
          echo "OK: plugin.json version $JSON_VER matches tag v$TAG_VER"

      - name: Verify marketplace.json version matches tag
        run: |
          MKT_VER=$(python3 -c "import json; p=json.load(open('.claude-plugin/marketplace.json')); print(p['plugins'][0]['version'])")
          TAG_VER="${{ steps.version.outputs.version }}"
          if [ "$MKT_VER" != "$TAG_VER" ]; then
            echo "FAIL: marketplace.json version ($MKT_VER) != tag version ($TAG_VER)"
            exit 1
          fi
          echo "OK: marketplace.json version $MKT_VER matches tag v$TAG_VER"

      - name: Validate all SKILL.md frontmatter
        run: |
          python3 << 'PYEOF'
          import yaml, os, sys
          failed = 0
          for root, dirs, files in os.walk('.'):
              if '.git' in root:
                  continue
              for f in files:
                  if f != 'SKILL.md':
                      continue
                  path = os.path.join(root, f)
                  content = open(path).read()
                  if not content.startswith('---'):
                      print(f'  FAIL {path}: no YAML frontmatter')
                      failed += 1
                      continue
                  parts = content.split('---', 2)
                  if len(parts) < 3:
                      print(f'  FAIL {path}: unclosed frontmatter')
                      failed += 1
                      continue
                  try:
                      fm = yaml.safe_load(parts[1])
                      if not isinstance(fm, dict):
                          print(f'  FAIL {path}: frontmatter is not a mapping')
                          failed += 1
                      else:
                          name = fm.get('name', 'UNNAMED')
                          print(f'  OK  {path} ({name})')
                  except Exception as e:
                      print(f'  FAIL {path}: {e}')
                      failed += 1
          if failed:
              print(f'\n{failed} SKILL.md file(s) have invalid frontmatter -- refusing to publish')
              sys.exit(1)
          print('All SKILL.md frontmatter: valid')
          PYEOF

      - name: Generate changelog from commits since last tag
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            echo "## Changes since $LAST_TAG" > CHANGELOG.md
            echo "" >> CHANGELOG.md
            git log --pretty=format:'- %s (%h)' "$LAST_TAG..HEAD" >> CHANGELOG.md
          else
            echo "## Initial release" > CHANGELOG.md
            echo "" >> CHANGELOG.md
            git log --pretty=format:'- %s (%h)' >> CHANGELOG.md
          fi
          echo "" >> CHANGELOG.md
          echo "---" >> CHANGELOG.md
          cat CHANGELOG.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@5a6f51711ce2ba103b78f5e9550f810679f11e0e # v3
        with:
          name: ${{ steps.version.outputs.tag }}
          body_path: CHANGELOG.md
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            skills/brain-init/SKILL.md
            skills/brain-init/scripts/brain-init.sh
            skills/brain-init/scripts/validate-vault.sh
            .claude-plugin/plugin.json
            .claude-plugin/marketplace.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
