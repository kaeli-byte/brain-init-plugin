# OpenCodeReview — automated LLM PR review
#
# Reviews pull requests using the reusable composite action from
# alibaba/open-code-review (https://open-codereview.ai/docs/cicd).
# The review is advisory: it posts a sticky summary comment plus inline
# findings, and never requests changes or blocks the PR.
#
# Triggers:
#   - pull_request_target: opened, synchronize, reopened (non-draft PRs)
#   - issue_comment: a maintainer comments `/review` (or `/open-code-review`)
#
# Required configuration (Settings -> Secrets and variables -> Actions):
#   secret    OCR_LLM_URL            LLM API endpoint
#   secret    OCR_LLM_AUTH_TOKEN     LLM auth token
#   variable  OCR_LLM_MODEL          model name
#   variable  OCR_LLM_USE_ANTHROPIC  'true' for Anthropic, 'false' for OpenAI-compatible
#
# If the secrets are not configured (e.g. on a fork), the workflow logs a
# warning and skips cleanly instead of failing the run.
#
# Note: GITHUB_TOKEN is automatically provided by GitHub Actions.

name: AI Code Review

# Conditional concurrency group (GitHub evaluates concurrency BEFORE job-level
# if-conditions): real review triggers for the same PR share one group so a new
# push cancels a stale review; unrelated comments land in a unique noop group
# and can never cancel a running review.
concurrency:
  group: >-
    ${{
      (
        (
          github.event_name == 'pull_request_target'
          && !github.event.pull_request.draft
        )
        || (
          github.event_name == 'issue_comment'
          && github.event.issue.pull_request
          && github.event.comment.user.type != 'Bot'
          && (
            github.event.comment.author_association == 'MEMBER'
            || github.event.comment.author_association == 'OWNER'
            || github.event.comment.author_association == 'COLLABORATOR'
          )
          && (
            github.event.comment.body == '/review'
            || startsWith(github.event.comment.body, '/review ')
            || github.event.comment.body == '/open-code-review'
            || startsWith(github.event.comment.body, '/open-code-review ')
          )
        )
      )
      && format('ocr-{0}', github.event.pull_request.number || github.event.issue.number)
      || format('noop-{0}', github.run_id)
    }}
  cancel-in-progress: true

on:
  # pull_request_target (not pull_request) so LLM secrets are available for
  # PRs from forks. Safe here because the action only reads the diff and
  # posts comments; it never checks out or executes PR code.
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

# Workflow-level permissions are read-only; only the review job elevates to
# pull-requests: write so preflight runs with minimal privileges.
permissions:
  contents: read

jobs:
  # Skip quietly when the LLM secrets/vars are not configured. Job output is
  # consumed by the review job below; a missing config never fails the run.
  preflight:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check OCR configuration
        id: check
        env:
          OCR_LLM_URL: ${{ secrets.OCR_LLM_URL }}
          OCR_LLM_AUTH_TOKEN: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          OCR_LLM_MODEL: ${{ vars.OCR_LLM_MODEL }}
          OCR_LLM_USE_ANTHROPIC: ${{ vars.OCR_LLM_USE_ANTHROPIC }}
        run: |
          if [ -n "$OCR_LLM_URL" ] && [ -n "$OCR_LLM_AUTH_TOKEN" ] && \
             [ -n "$OCR_LLM_MODEL" ] && [ -n "$OCR_LLM_USE_ANTHROPIC" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::AI code review skipped: set OCR_LLM_URL and OCR_LLM_AUTH_TOKEN secrets plus OCR_LLM_MODEL and OCR_LLM_USE_ANTHROPIC variables."
          fi

  review:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    # Advisory-only review. Never gate on findings; the composite action only
    # posts comments and cannot request changes.
    if: |
      needs.preflight.outputs.configured == 'true'
      && (
        (
          github.event_name == 'pull_request_target'
          && !github.event.pull_request.draft
        )
        || (
          github.event_name == 'issue_comment'
          && github.event.issue.pull_request
          && github.event.comment.user.type != 'Bot'
          && (
            github.event.comment.author_association == 'MEMBER'
            || github.event.comment.author_association == 'OWNER'
            || github.event.comment.author_association == 'COLLABORATOR'
          )
          && (
            github.event.comment.body == '/review'
            || startsWith(github.event.comment.body, '/review ')
            || github.event.comment.body == '/open-code-review'
            || startsWith(github.event.comment.body, '/open-code-review ')
          )
        )
      )
    steps:
      # Comments posted as the GitHub App bot (not github-actions[bot]), per
      # the OpenCodeReview examples: GITHUB_TOKEN suppresses events from its
      # own comments, but an App token does not — the job-level Bot guard in
      # `if` is what prevents self-triggering loops, so keep it intact.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.MY_GITHUB_APP_ID }}
          private-key: ${{ secrets.MY_GITHUB_APP_PRIVATE_KEY }}
          installation-id: ${{ secrets.GITHUB_APP_INSTALLATION_ID }}

      - name: Get PR context
        id: pr-context
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            // issue_comment events lack pull_request payload fields, so
            // resolve base/head explicitly for the review action.
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            core.setOutput('base_ref', pullRequest.base.ref);
            core.setOutput('head_sha', pullRequest.head.sha);

      # Pinned to the full commit SHA that added bounded inline-comment
      # batching (alibaba/open-code-review#507); the npm package is pinned to
      # the vetted version as well. Bump both deliberately after reviewing
      # upstream changes. continue-on-error keeps a broken OCR run from
      # failing the workflow — the review is advisory.
      - name: Run OpenCodeReview
        continue-on-error: true
        uses: alibaba/open-code-review@2e9938780b941e46b76ab3340e718e280b10c66f
        with:
          llm_url: ${{ secrets.OCR_LLM_URL }}
          llm_auth_token: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          llm_model: ${{ vars.OCR_LLM_MODEL }}
          llm_use_anthropic: ${{ vars.OCR_LLM_USE_ANTHROPIC }}
          github_token: ${{ steps.app-token.outputs.token }}
          base_ref: ${{ steps.pr-context.outputs.base_ref }}
          head_sha: ${{ steps.pr-context.outputs.head_sha }}
          ocr_version: '1.8.0'
          # Advisory posture: one sticky summary comment, updated in place on
          # each run; inline findings are incremental and never deleted.
          sticky_summary: 'true'
          incremental: 'true'
          upload_artifacts: 'true'
